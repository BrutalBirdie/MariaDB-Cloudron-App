name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/brutalbirdie/mariadb-cloudron-app

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag matches manifest version
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME}"
          manifest_version=$(yq -p json -oy .version CloudronManifest.json)
          if [[ "${version}" != "${manifest_version}" ]]; then
              echo "tag ${version} does not match CloudronManifest version ${manifest_version}"
              exit 1
          fi
          if [[ "$(yq -p json -oy ".versions | has(\"${version}\")" CloudronVersions.json)" == "true" ]]; then
              echo "${version} is already in CloudronVersions.json"
              exit 1
          fi

      - name: Extract changelog entry
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v entry="[${version}]" '$0 == entry { found=1; next } /^\[/ { found=0 } found && NF' CHANGELOG > changelog.md
          if [[ ! -s changelog.md ]]; then
              echo "no CHANGELOG entry for ${version}"
              exit 1
          fi
          cat changelog.md

      - name: End-to-end test
        env:
          ARTIFACTS: ${{ runner.temp }}/e2e
        run: test/e2e/run.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image
        if: github.ref_type == 'tag'
        run: |
          docker tag mdbapp:e2e "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker logout ghcr.io
          # Cloudron servers pull anonymously, a private package would break installs
          if ! docker manifest inspect "${IMAGE}:${GITHUB_REF_NAME}" >/dev/null; then
              echo "${IMAGE} is not public, change its visibility in the package settings and re-run this job"
              exit 1
          fi

      - name: Add version to CloudronVersions.json
        if: github.ref_type == 'tag'
        run: |
          npm i -g cloudron@9.0.3
          cloudron versions add --state published --image "${IMAGE}:${GITHUB_REF_NAME}"
          cloudron versions verify
          cp CloudronVersions.json "${RUNNER_TEMP}/"
          git checkout CloudronVersions.json
          git switch master
          if ! git diff --quiet "${GITHUB_REF_NAME}" master -- CloudronVersions.json; then
              echo "CloudronVersions.json on master changed since ${GITHUB_REF_NAME}"
              exit 1
          fi
          cp "${RUNNER_TEMP}/CloudronVersions.json" .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CloudronVersions.json
          git commit -m "Publish ${GITHUB_REF_NAME}"
          # pushes with GITHUB_TOKEN do not start workflows - https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
          git push origin master

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
              cat changelog.md
              echo
              echo "Docker image: \`${IMAGE}:${GITHUB_REF_NAME}\`"
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
