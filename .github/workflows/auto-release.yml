name: auto-release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

concurrency:
  group: auto-release

jobs:
  bump:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # queued runs must build on top of the previous release commit
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump version
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pulls=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          branch=$(yq -p json -oy '.[0].head.ref // ""' <<< "${pulls}")
          title=$(yq -p json -oy '.[0].title // ""' <<< "${pulls}")
          if [[ "${branch}" != renovate/* ]]; then
              echo "${GITHUB_SHA} is not a Renovate merge"
              exit 0
          fi
          if git diff --quiet "${GITHUB_SHA}^1" "${GITHUB_SHA}" -- Dockerfile panel/; then
              echo "Dockerfile and panel unchanged, nothing to release"
              exit 0
          fi

          version=$(yq -p json -oy .version CloudronManifest.json)
          next="${version%.*}.$(( ${version##*.} + 1 ))"
          upstream=$(sed -n 's/^ARG MARIADB_VERSION=[0-9]*:\([0-9.]*\)-.*/\1/p' Dockerfile)
          yq -i -p json -o json ".version = \"${next}\" | .upstreamVersion = \"${upstream}\"" CloudronManifest.json
          { printf '[%s]\n* %s\n\n' "${next}" "${title}"; cat CHANGELOG; } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${next}" --trailer "Co-authored-by: BrutalBirdie <20840012+BrutalBirdie@users.noreply.github.com>"
          git tag "${next}"
          # a tag pushed with GITHUB_TOKEN does not trigger release.yml, so it is called below
          git push --atomic origin HEAD "refs/tags/${next}"
          echo "tag=${next}" >> "${GITHUB_OUTPUT}"

  release:
    needs: bump
    if: needs.bump.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
